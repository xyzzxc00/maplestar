<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>楓星升等計算器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1e1e1e;
    min-height: 100vh;
    font-family: 'Segoe UI', '微軟正黑體', sans-serif;
    color: #f0f0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px;
    gap: 16px;
  }
  h1 { font-size: 2rem; color: #5dca82; margin-bottom: 2px; text-align: center; }
  .subtitle { font-size: 0.95rem; color: #556655; text-align: center; }

  .layout {
    display: flex;
    gap: 16px;
    width: 100%;
    max-width: 1200px;
    align-items: flex-start;
  }
  .card {
    background: #2a2a2a;
    border: 1px solid rgba(80,200,120,0.2);
    border-radius: 16px;
    padding: 28px;
    flex: 1;
    box-shadow: 0 4px 20px rgba(0,0,0,0.35);
  }
  .full-card {
    background: #2a2a2a;
    border: 1px solid rgba(80,200,120,0.2);
    border-radius: 16px;
    padding: 24px 28px;
    width: 100%;
    max-width: 1200px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.35);
  }
  .card-title {
    font-size: 1rem;
    color: #5ab87a;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid #383838;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .section { margin-bottom: 20px; }
  .section:last-child { margin-bottom: 0; }
  .section-label {
    font-size: 0.82rem;
    color: #5ab87a;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .section-label .optional { color: #555; font-size: 0.75rem; text-transform: none; letter-spacing: 0; margin-left: 5px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .field { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 0.88rem; color: #aaaaaa; }
  input[type="number"], input[type="text"] {
    background: #333;
    border: 1px solid #484848;
    border-radius: 8px;
    color: #f0f0f0;
    padding: 10px 12px;
    font-size: 1rem;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  input[type="number"]:focus, input[type="text"]:focus { border-color: #4aaa70; box-shadow: 0 0 0 3px rgba(60,160,90,0.15); }
  input[type="number"]::placeholder, input[type="text"]::placeholder { color: #555; }
  .arrow { font-size: 1.3rem; color: #4a8a60; flex-shrink: 0; margin-top: 20px; }

  /* toggle tabs */
  .toggle-tabs { display: flex; margin-bottom: 10px; border-radius: 8px; overflow: hidden; border: 1px solid #484848; width: fit-content; }
  .toggle-tab {
    background: #333; color: #888; padding: 7px 16px; cursor: pointer;
    font-size: 0.88rem; border: none; transition: all 0.15s;
  }
  .toggle-tab.active { background: #2e7d4a; color: #fff; }

  .mult-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .mult-btn {
    background: #333; border: 1px solid #484848; border-radius: 6px;
    color: #ccc; padding: 8px 14px; cursor: pointer; font-size: 0.95rem; transition: all 0.15s;
    flex: 1; min-width: 48px; text-align: center;
  }
  .mult-btn:hover { background: #3d3d3d; }
  .mult-btn.active { background: #2e7d4a; border-color: #3aaa66; color: #fff; box-shadow: 0 2px 8px rgba(46,125,74,0.3); }

  /* Result card */
  .result-total {
    background: #333; border: 1px solid rgba(80,200,120,0.2);
    border-radius: 10px; padding: 18px; text-align: center; margin-bottom: 14px;
  }
  .result-total .r-label { font-size: 0.82rem; color: #5ab87a; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
  .result-total .r-value { font-size: 1.8rem; font-weight: bold; color: #fff; }
  .result-total .r-sub { font-size: 0.88rem; color: #666; margin-top: 3px; }

  .time-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .time-box {
    background: #333; border: 1px solid rgba(80,200,120,0.15);
    border-radius: 10px; padding: 16px 12px; text-align: center;
  }
  .time-box .r-label { font-size: 0.78rem; color: #5ab87a; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 7px; }
  .time-box .r-main { font-size: 1.2rem; font-weight: bold; color: #fff; margin-bottom: 3px; }
  .time-box .r-alt { font-size: 0.88rem; color: #888; }
  .time-box .r-sub { font-size: 0.8rem; color: #555; margin-top: 2px; }

  .divider { border: none; border-top: 1px solid #383838; margin: 14px 0; }
  .stat-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid #2e2e2e; font-size: 0.95rem;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { color: #777; }
  .stat-value { color: #f0f0f0; font-weight: 600; }

  /* coupon box */
  .info-box {
    background: #2e3d32; border: 1px solid rgba(80,200,120,0.3);
    border-radius: 10px; padding: 18px; margin-top: 14px;
  }
  .info-box .ib-title { font-size: 0.82rem; color: #5ab87a; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .info-stat {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0; border-bottom: 1px solid #3a4a3e; font-size: 0.95rem;
  }
  .info-stat:last-child { border-bottom: none; }
  .info-stat .is-label { color: #888; }
  .info-stat .is-value { color: #f0f0f0; font-weight: 600; }
  .info-stat .is-hl { color: #5dca82; font-weight: 700; font-size: 1.05rem; }

  /* Share button */
  .share-btn {
    background: #2e3d32; border: 1px solid rgba(80,200,120,0.4);
    border-radius: 8px; color: #5ab87a; padding: 7px 14px;
    cursor: pointer; font-size: 0.82rem; display: flex; align-items: center; gap: 5px;
    transition: all 0.15s; white-space: nowrap; flex-shrink: 0;
  }
  .share-btn:hover { background: #344a3a; border-color: rgba(80,200,120,0.7); }
  .share-btn.copied { background: #2a4a2a; border-color: #5dca82; color: #5dca82; }

  /* Breakdown table */
  .breakdown-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  .breakdown-table th {
    background: #303030; color: #5ab87a; padding: 9px 14px;
    text-align: left; font-weight: 600; position: sticky; top: 0;
    border-bottom: 1px solid #484848; z-index: 1;
  }
  .breakdown-table td { padding: 7px 14px; border-bottom: 1px solid #2a2a2a; color: #ccc; }
  .breakdown-table tr:last-child td { border-bottom: none; }
  .breakdown-table tbody tr:hover td { background: #2e2e2e; }
  .breakdown-table td:first-child { color: #777; }
  .breakdown-table td.hl { color: #5dca82; font-weight: 600; }
  .breakdown-wrap {
    overflow-x: auto; overflow-y: auto; max-height: 360px;
    border-radius: 10px; border: 1px solid #383838; margin-top: 4px;
  }

  /* History */
  .history-empty { color: #555; font-size: 0.95rem; text-align: center; padding: 16px 0; }
  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .history-item {
    background: #333; border: 1px solid #3a3a3a; border-radius: 10px;
    padding: 12px 16px; cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; gap: 12px;
  }
  .history-item:hover { background: #383838; border-color: rgba(80,200,120,0.3); }
  .hi-meta { flex: 1; min-width: 0; }
  .hi-range { font-size: 0.95rem; color: #f0f0f0; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hi-detail { font-size: 0.82rem; color: #777; }
  .hi-time { text-align: right; flex-shrink: 0; }
  .hi-result { font-size: 0.95rem; color: #5dca82; font-weight: 700; }
  .hi-ts { font-size: 0.75rem; color: #555; margin-top: 1px; }
  .hi-del {
    background: none; border: none; color: #554040; cursor: pointer;
    font-size: 1rem; padding: 5px 8px; border-radius: 4px;
    transition: color 0.15s; flex-shrink: 0;
  }
  .hi-del:hover { color: #cc4444; }
  .history-clear {
    background: none; border: 1px solid #484848; border-radius: 6px;
    color: #666; padding: 5px 13px; cursor: pointer; font-size: 0.82rem;
    transition: all 0.15s; flex-shrink: 0;
  }
  .history-clear:hover { color: #cc4444; border-color: #664444; }

  .note { font-size: 0.78rem; color: #444; text-align: center; margin-top: 10px; }
  .empty { color: #444; font-size: 1rem; }

  /* ── Mobile ── */
  @media (max-width: 760px) {
    body { padding: 14px 12px; gap: 12px; }
    h1 { font-size: 1.5rem; }
    .layout { flex-direction: column; gap: 12px; }
    .card { padding: 20px 16px; width: 100%; }
    .full-card { padding: 20px 16px; }
    .card-title { font-size: 0.88rem; flex-wrap: wrap; }
    .result-total .r-value { font-size: 1.5rem; }
    .time-box .r-main { font-size: 1.05rem; }
    .stat-row { font-size: 0.88rem; }
    .info-stat { font-size: 0.88rem; }
    .breakdown-table th, .breakdown-table td { padding: 7px 10px; font-size: 0.82rem; }
    .history-item { padding: 10px 12px; gap: 8px; }
    .hi-range { font-size: 0.88rem; }
    .hi-result { font-size: 0.88rem; }
    .mult-btn { padding: 8px 10px; font-size: 0.9rem; }
    input[type="number"], input[type="text"] { font-size: 0.95rem; padding: 9px 11px; }
    label { font-size: 0.82rem; }
  }
  @media (max-width: 400px) {
    .time-grid { grid-template-columns: 1fr; }
    .share-btn span { display: none; }
  }
</style>
</head>
<body>
  <h1>⚔ 楓星升等計算器</h1>
  <p class="subtitle">MapleStar Leveling Calculator</p>

  <div class="layout">
    <!-- 左卡：輸入 -->
    <div class="card">
      <div class="card-title">輸入設定</div>

      <div class="section">
        <div class="section-label">等級範圍</div>
        <div class="row">
          <div class="field">
            <label>目前等級</label>
            <input type="number" id="fromLevel" placeholder="例：126" min="1" max="199">
          </div>
          <div class="arrow">→</div>
          <div class="field">
            <label>目標等級</label>
            <input type="number" id="toLevel" placeholder="例：135" min="2" max="200">
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-label">
          目前等級進度
          <span class="optional">（選填）</span>
        </div>
        <div class="toggle-tabs">
          <button class="toggle-tab active" id="tab-pct" onclick="switchProgressTab('pct')">百分比 %</button>
          <button class="toggle-tab" id="tab-exp" onclick="switchProgressTab('exp')">EXP 數值</button>
        </div>
        <div id="progress-pct" class="field">
          <label>目前已有 % （0 ~ 99.99）</label>
          <input type="number" id="currentPct" placeholder="例：4.70" min="0" max="99.99" step="0.01">
        </div>
        <div id="progress-exp" class="field" style="display:none">
          <label>目前已有 EXP 數值</label>
          <input type="number" id="currentExp" placeholder="例：1540592" min="0">
        </div>
      </div>

      <div class="section">
        <div class="section-label">獲得經驗設定</div>
        <div class="toggle-tabs">
          <button class="toggle-tab" id="tab-permin" onclick="switchExpTab('permin')">每分鐘</button>
          <button class="toggle-tab active" id="tab-per10min" onclick="switchExpTab('per10min')">每10分鐘</button>
        </div>
        <div id="exp-permin" class="field" style="display:none">
          <label>EXP / 分鐘（未加倍）　可用 W 代替萬，如 18.5W</label>
          <input type="text" id="expPerMin" placeholder="例：18.5W 或 185000" inputmode="decimal">
        </div>
        <div id="exp-per10min" class="field">
          <label>EXP / 10分鐘（未加倍）　可用 W 代替萬，如 185W</label>
          <input type="text" id="expPer10Min" placeholder="例：185W 或 1850000" inputmode="decimal">
        </div>
      </div>

      <div class="section">
        <div class="section-label">加倍設定</div>
        <div class="mult-btns">
          <button class="mult-btn" data-val="1">1x</button>
          <button class="mult-btn" data-val="1.5">1.5x</button>
          <button class="mult-btn active" data-val="2">2x</button>
          <button class="mult-btn" data-val="3">3x</button>
          <button class="mult-btn" data-val="4">4x</button>
        </div>
        <div class="field">
          <label>自訂倍率</label>
          <input type="number" id="customMult" value="2" min="1" step="0.5">
        </div>
      </div>

      <div class="section">
        <div class="section-label">
          加倍卷排程
          <span class="optional">（選填）</span>
        </div>
        <div class="field">
          <label>每天打幾小時</label>
          <input type="number" id="dailyHours" placeholder="例：3" min="0.5" max="24" step="0.5">
        </div>
      </div>
    </div>

    <!-- 右卡：結果 -->
    <div class="card">
      <div class="card-title">
        計算結果
        <button class="share-btn" id="shareBtn" onclick="shareURL()">🔗 <span>複製分享連結</span></button>
      </div>

      <div class="result-total">
        <div class="r-label">剩餘所需經驗值</div>
        <div class="r-value" id="totalExp"><span class="empty">請輸入等級範圍</span></div>
        <div class="r-sub" id="levelRange"></div>
      </div>

      <div class="time-grid">
        <div class="time-box">
          <div class="r-label">不加倍 1x</div>
          <div class="r-main" id="timeNo_dhm"><span class="empty">—</span></div>
          <div class="r-alt" id="timeNo_h"></div>
          <div class="r-sub" id="timeNo_min"></div>
        </div>
        <div class="time-box">
          <div class="r-label">加倍後 <span id="multLabel">2x</span></div>
          <div class="r-main" id="timeMult_dhm"><span class="empty">—</span></div>
          <div class="r-alt" id="timeMult_h"></div>
          <div class="r-sub" id="timeMult_min"></div>
        </div>
      </div>

      <hr class="divider">

      <div class="stat-row">
        <span class="stat-label">加倍省下時間</span>
        <span class="stat-value" id="timeSaved">—</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">不加倍（總分鐘）</span>
        <span class="stat-value" id="minNo">—</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">加倍後（總分鐘）</span>
        <span class="stat-value" id="minMult">—</span>
      </div>

      <p class="note">※ 官方數值，支援 Lv.1 ~ Lv.200</p>

      <div class="info-box">
        <div class="ib-title">加倍卷計算（每張 30 分鐘）</div>
        <div class="info-stat">
          <span class="is-label">全程加倍需要幾張</span>
          <span class="is-value is-hl" id="couponsNeeded">—</span>
        </div>
        <div class="info-stat">
          <span class="is-label">幾天能練完（加倍）</span>
          <span class="is-value" id="daysWithBoost">—</span>
        </div>
        <div class="info-stat">
          <span class="is-label">幾天能練完（不加倍）</span>
          <span class="is-value" id="daysNoBoost">—</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 逐等級明細 -->
  <div class="full-card" id="breakdownCard" style="display:none">
    <div class="card-title" style="cursor:pointer;user-select:none" onclick="toggleBreakdown()">
      <span>逐等級明細</span>
      <span id="breakdownArrow" style="font-size:0.85rem;color:#5ab87a">▼</span>
    </div>
    <div id="breakdownTableWrap" style="display:none">
      <div class="breakdown-wrap">
        <table class="breakdown-table">
          <thead>
            <tr>
              <th>等級</th>
              <th>所需 EXP</th>
              <th>時間 1x</th>
              <th>時間 <span id="breakdownMultLabel">2x</span></th>
            </tr>
          </thead>
          <tbody id="breakdownTbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 歷史紀錄 -->
  <div class="full-card">
    <div class="card-title">
      歷史紀錄
      <button class="history-clear" onclick="clearHistory()">清除全部</button>
    </div>
    <div id="historyList"><div class="history-empty">尚無紀錄，計算後自動儲存</div></div>
  </div>

<script>
// === EXP TABLE ===
const EXP_TABLE = [];
EXP_TABLE[0] = 0; EXP_TABLE[1] = 0;
const RAW = [
  [2,15],[3,34],[4,57],[5,92],[6,135],[7,372],[8,560],[9,840],[10,1350],
  [11,1534],[12,2090],[13,2730],[14,3549],[15,4582],[16,5746],[17,7176],[18,8915],[19,10842],[20,13140],
  [21,15861],[22,18837],[23,22308],[24,26332],[25,35685],[26,37186],[27,41382],[28,47502],[29,54125],[30,66990],
  [31,75936],[32,85932],[33,97066],[34,108878],[35,121951],[36,136382],[37,151620],[38,168385],[39,186677],[40,205951],
  [41,226968],[42,249841],[43,273812],[44,299796],[45,327915],[46,357294],[47,388976],[48,423091],[49,458640],[50,496801],
  [51,524025],[52,552741],[53,583031],[54,614981],[55,648682],[56,684229],[57,721725],[58,761275],[59,802992],[60,846932],
  [61,893410],[62,942369],[63,994011],[64,1048482],[65,1105939],[66,1166544],[67,1230029],[68,1297900],[69,1369025],[70,1547193],
  [71,1631979],[72,1721412],[73,1815744],[74,1915247],[75,2020202],[76,2130909],[77,2247682],[78,2370855],[79,2500777],[80,2638427],
  [81,2782370],[82,2934845],[83,3095667],[84,3265317],[85,3444255],[86,3633000],[87,3832089],[88,4042086],[89,4263592],[90,4497237],
  [91,4743685],[92,4963139],[93,5277838],[94,5567064],[95,5872138],[96,6193931],[97,6533358],[98,6891385],[99,7215330],[100,7667376],
  [101,8087547],[102,8530745],[103,8998230],[104,9491681],[105,10011457],[106,10560084],[107,11138777],[108,11749257],[109,12393036],[110,13072167],
  [111,13788529],[112,14544140],[113,15341158],[114,16181853],[115,17068619],[116,18003979],[117,18990597],[118,20031281],[119,21128994],[120,23772654],
  [121,25075395],[122,26449526],[123,27898960],[124,29427822],[125,31040466],[126,32741483],[127,34535716],[128,36428272],[129,38424541],[130,40530206],
  [131,42751261],[132,45094030],[133,47565183],[134,50171755],[135,52921167],[136,55821246],[137,58880250],[138,62106888],[139,65510344],[140,69100311],
  [141,72887008],[142,76881216],[143,81094306],[144,85538273],[145,90225770],[146,95170142],[147,100385465],[148,105886588],[149,111689173],[150,125172848],
  [151,132032320],[152,139267691],[153,146899636],[154,154949656],[155,163440896],[156,172397495],[157,181844837],[158,191809934],[159,202321118],[160,213408315],
  [161,225103090],[162,245938739],[163,250450381],[164,264175062],[165,278651855],[166,293921976],[167,310020400],[168,327018483],[169,344939096],[170,363841758],
  [171,383780287],[172,404811446],[173,426995113],[174,450394445],[175,475076060],[176,501101360],[177,528571068],[178,557536762],[179,588089777],[180,656806337],
  [181,692799324],[182,730764727],[183,770810634],[184,813051056],[185,857606254],[186,904603076],[187,954175324],[188,1006464132],[189,1061618365],[190,1119795051],
  [191,1181159820],[192,1245887378],[193,1322262006],[194,1386177633],[195,1462140651],[196,1542265949],[197,1626782123],[198,1715929778],[199,1809962734],
];
RAW.forEach(([lv, exp]) => { EXP_TABLE[lv] = exp; });

// === STATE ===
let currentMult = 2;
let progressTab = 'pct';
let expTab = 'per10min';
let breakdownOpen = false;
let _histTimer = null;

// === HELPERS ===
function formatExp(n) {
  if (n >= 1e12) return (n / 1e12).toFixed(2) + ' 兆';
  if (n >= 1e8)  return (n / 1e8).toFixed(2) + ' 億';
  if (n >= 1e4)  return (n / 1e4).toFixed(2) + ' 萬';
  return n.toLocaleString();
}
function formatDHM(minutes) {
  if (!isFinite(minutes) || minutes <= 0) return null;
  const m = Math.ceil(minutes);
  if (m < 60) return m + ' 分鐘';
  const h = Math.floor(m / 60), rm = m % 60;
  if (h < 24) return h + ' 小時' + (rm ? ' ' + rm + ' 分' : '');
  const d = Math.floor(h / 24), rh = h % 24;
  return d + ' 天 ' + rh + ' 小時' + (rm ? ' ' + rm + ' 分' : '');
}
function formatHM(minutes) {
  if (!isFinite(minutes) || minutes <= 0) return null;
  const m = Math.ceil(minutes);
  if (m < 60) return m + ' 分鐘';
  const h = Math.floor(m / 60), rm = m % 60;
  return h + ' 小時' + (rm ? ' ' + rm + ' 分' : '');
}
function getTotalExp(from, to) {
  let total = 0;
  for (let lv = from; lv < to; lv++) total += EXP_TABLE[lv] || 0;
  return total;
}
function parseExpVal(val) {
  if (!val || !val.trim()) return NaN;
  const s = val.trim().toUpperCase();
  if (s.endsWith('W')) {
    const n = parseFloat(s.slice(0, -1));
    return isNaN(n) ? NaN : n * 10000;
  }
  return parseFloat(s);
}
function setText(id, text) { document.getElementById(id).textContent = text; }
function setHTML(id, html) { document.getElementById(id).innerHTML = html; }
function showEl(id, show)  { document.getElementById(id).style.display = show ? '' : 'none'; }

// === TABS ===
function switchExpTab(tab) {
  expTab = tab;
  showEl('exp-permin',   tab === 'permin');
  showEl('exp-per10min', tab === 'per10min');
  document.getElementById('tab-permin').classList.toggle('active', tab === 'permin');
  document.getElementById('tab-per10min').classList.toggle('active', tab === 'per10min');
  calculate();
}
function switchProgressTab(tab) {
  progressTab = tab;
  showEl('progress-pct', tab === 'pct');
  showEl('progress-exp', tab === 'exp');
  document.getElementById('tab-pct').classList.toggle('active', tab === 'pct');
  document.getElementById('tab-exp').classList.toggle('active', tab === 'exp');
  calculate();
}

// === BREAKDOWN TABLE ===
function toggleBreakdown() {
  breakdownOpen = !breakdownOpen;
  showEl('breakdownTableWrap', breakdownOpen);
  document.getElementById('breakdownArrow').textContent = breakdownOpen ? '▲' : '▼';
}
function renderBreakdownTable(from, to, alreadyExp, epm, mult) {
  document.getElementById('breakdownMultLabel').textContent = mult + 'x';
  let rows = '';
  for (let lv = from; lv < to; lv++) {
    const full = EXP_TABLE[lv] || 0;
    const exp  = (lv === from && alreadyExp > 0) ? full - alreadyExp : full;
    const mNo   = epm > 0 ? exp / epm : 0;
    const mMult = epm > 0 ? exp / (epm * mult) : 0;
    rows += `<tr>
      <td>Lv.${lv}</td>
      <td class="hl">${formatExp(exp)}</td>
      <td>${epm > 0 ? (formatDHM(mNo) || '—') : '—'}</td>
      <td>${epm > 0 ? (formatDHM(mMult) || '—') : '—'}</td>
    </tr>`;
  }
  document.getElementById('breakdownTbody').innerHTML =
    rows || '<tr><td colspan="4" style="color:#555;text-align:center;padding:16px">無資料</td></tr>';
}

// === CALCULATE ===
function getEpm() {
  if (expTab === 'permin') return parseExpVal(document.getElementById('expPerMin').value);
  return parseExpVal(document.getElementById('expPer10Min').value) / 10;
}

function calculate() {
  const fromVal = document.getElementById('fromLevel').value;
  const toVal   = document.getElementById('toLevel').value;
  const from = parseInt(fromVal), to = parseInt(toVal);
  const mult = currentMult;
  document.getElementById('multLabel').textContent = mult + 'x';

  const epm    = getEpm();
  const hasEpm = !isNaN(epm) && epm > 0;

  const reset = () => {
    setHTML('totalExp', '<span class="empty">請輸入等級範圍</span>');
    setText('levelRange', '');
    setHTML('timeNo_dhm', '<span class="empty">—</span>');
    setText('timeNo_h', ''); setText('timeNo_min', '');
    setHTML('timeMult_dhm', '<span class="empty">—</span>');
    setText('timeMult_h', ''); setText('timeMult_min', '');
    setText('timeSaved', '—'); setText('minNo', '—'); setText('minMult', '—');
    setText('couponsNeeded', '—');
    setText('daysWithBoost', '—'); setText('daysNoBoost', '—');
    showEl('breakdownCard', false); showEl('breakdownTableWrap', false);
  };

  if (!fromVal || !toVal || isNaN(from) || isNaN(to)) { reset(); return; }
  if (from >= to) {
    setHTML('totalExp', '<span class="empty">目標等級須大於目前等級</span>');
    setText('levelRange', ''); return;
  }
  if (to > 200) {
    setHTML('totalExp', '<span class="empty">最高支援至 200 等</span>');
    setText('levelRange', ''); return;
  }

  // Progress
  const levelExpNeeded = EXP_TABLE[from] || 0;
  let alreadyExp = 0;
  if (progressTab === 'pct') {
    const pct = parseFloat(document.getElementById('currentPct').value);
    if (!isNaN(pct) && pct > 0 && pct < 100) alreadyExp = levelExpNeeded * (pct / 100);
  } else {
    const owned = parseFloat(document.getElementById('currentExp').value);
    if (!isNaN(owned) && owned > 0) alreadyExp = Math.min(owned, levelExpNeeded);
  }

  const total = getTotalExp(from, to) - alreadyExp;
  const progressNote = alreadyExp > 0 ? '，已扣除進度' : '';
  setHTML('totalExp', formatExp(total));
  setText('levelRange', `Lv.${from} → Lv.${to}（${to - from} 等${progressNote}）`);

  showEl('breakdownCard', true);
  renderBreakdownTable(from, to, alreadyExp, hasEpm ? epm : 0, mult);
  showEl('breakdownTableWrap', breakdownOpen);

  if (!hasEpm) {
    setHTML('timeNo_dhm', '<span class="empty">請輸入 EXP/分</span>');
    setText('timeNo_h', ''); setText('timeNo_min', '');
    setHTML('timeMult_dhm', '<span class="empty">請輸入 EXP/分</span>');
    setText('timeMult_h', ''); setText('timeMult_min', '');
    setText('timeSaved', '—'); setText('minNo', '—'); setText('minMult', '—');
    setText('couponsNeeded', '—');
    setText('daysWithBoost', '—'); setText('daysNoBoost', '—');
    return;
  }

  const minNo   = total / epm;
  const minMult = total / (epm * mult);
  const saved   = minNo - minMult;

  setText('timeNo_dhm', formatDHM(minNo) || '—');
  const hmNo = formatHM(minNo), dhmNo = formatDHM(minNo);
  setText('timeNo_h',   hmNo !== dhmNo ? hmNo : '');
  setText('timeNo_min', Math.ceil(minNo).toLocaleString() + ' 分鐘');

  setText('timeMult_dhm', formatDHM(minMult) || '—');
  const hmMult = formatHM(minMult), dhmMult = formatDHM(minMult);
  setText('timeMult_h',   hmMult !== dhmMult ? hmMult : '');
  setText('timeMult_min', Math.ceil(minMult).toLocaleString() + ' 分鐘');

  setText('timeSaved', formatDHM(saved) || '—');
  setText('minNo',   Math.ceil(minNo).toLocaleString() + ' 分');
  setText('minMult', Math.ceil(minMult).toLocaleString() + ' 分');
  setText('couponsNeeded', mult <= 1 ? '無需加倍卷' : Math.ceil(minMult / 30) + ' 張');

  const dailyH = parseFloat(document.getElementById('dailyHours').value);
  const hasDaily = !isNaN(dailyH) && dailyH > 0;
  if (hasDaily) {
    const dm = dailyH * 60;
    setText('daysWithBoost', Math.ceil(minMult / dm) + ' 天');
    setText('daysNoBoost',   Math.ceil(minNo / dm) + ' 天');
  } else {
    setText('daysWithBoost', '—');
    setText('daysNoBoost',   '—');
  }

  scheduleHistorySave({ from, to, total, minNo, minMult, mult, alreadyExp });
}

// === SHARE URL ===
function buildParams() {
  const p = new URLSearchParams();
  p.set('from',  document.getElementById('fromLevel').value   || '');
  p.set('to',    document.getElementById('toLevel').value     || '');
  p.set('ptab',  progressTab);
  p.set('pct',   document.getElementById('currentPct').value  || '');
  p.set('exp',   document.getElementById('currentExp').value  || '');
  p.set('etab',  expTab);
  p.set('epm',   document.getElementById('expPerMin').value   || '');
  p.set('ep10',  document.getElementById('expPer10Min').value || '');
  p.set('mult',  currentMult);
  p.set('daily', document.getElementById('dailyHours').value  || '');
  return p;
}
function shareURL() {
  const url = location.href.split('?')[0] + '?' + buildParams().toString();
  const btn = document.getElementById('shareBtn');
  (navigator.clipboard?.writeText(url) || Promise.reject())
    .then(() => {
      btn.innerHTML = '✓ <span>已複製！</span>';
      btn.classList.add('copied');
      setTimeout(() => { btn.innerHTML = '🔗 <span>複製分享連結</span>'; btn.classList.remove('copied'); }, 2000);
    })
    .catch(() => prompt('複製此連結：', url));
}
function loadFromURL() {
  const p = new URLSearchParams(location.search);
  if (!p.has('from') && !p.has('to')) return;
  if (p.get('from')) document.getElementById('fromLevel').value = p.get('from');
  if (p.get('to'))   document.getElementById('toLevel').value   = p.get('to');
  if (p.has('ptab')) switchProgressTab(p.get('ptab'));
  if (p.get('pct'))  document.getElementById('currentPct').value = p.get('pct');
  if (p.get('exp'))  document.getElementById('currentExp').value = p.get('exp');
  if (p.has('etab')) switchExpTab(p.get('etab'));
  if (p.get('epm'))  document.getElementById('expPerMin').value  = p.get('epm');
  if (p.get('ep10')) document.getElementById('expPer10Min').value = p.get('ep10');
  if (p.has('mult')) {
    currentMult = parseFloat(p.get('mult')) || 2;
    document.getElementById('customMult').value = currentMult;
    document.querySelectorAll('.mult-btn').forEach(b =>
      b.classList.toggle('active', parseFloat(b.dataset.val) === currentMult));
  }
  if (p.get('daily')) document.getElementById('dailyHours').value = p.get('daily');
}

// === HISTORY ===
const HIST_KEY = 'maplecalc_v3_history';

function scheduleHistorySave(entry) {
  clearTimeout(_histTimer);
  _histTimer = setTimeout(() => saveHistory(entry), 3000);
}
function saveHistory(entry) {
  const url = location.href.split('?')[0] + '?' + buildParams().toString();
  const progressNote = entry.alreadyExp > 0 ? '，已扣除進度' : '';
  const item = {
    ts: Date.now(),
    rangeText: `Lv.${entry.from} → Lv.${entry.to}（${entry.to - entry.from} 等${progressNote}）`,
    totalNet: entry.total,
    minNo: entry.minNo,
    minMult: entry.minMult,
    mult: entry.mult,
    url,
  };
  let hist = getHistory();
  if (hist.length && hist[0].url === item.url) return;
  hist.unshift(item);
  localStorage.setItem(HIST_KEY, JSON.stringify(hist.slice(0, 10)));
  renderHistory();
}
function getHistory() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch { return []; }
}
function clearHistory() { localStorage.removeItem(HIST_KEY); renderHistory(); }
function deleteHistoryItem(idx) {
  const hist = getHistory(); hist.splice(idx, 1);
  localStorage.setItem(HIST_KEY, JSON.stringify(hist)); renderHistory();
}
function restoreHistory(url) {
  history.replaceState(null, '', url);
  loadFromURL();
  calculate();
}
function formatTS(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('zh-TW') + ' ' +
         d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
}
function renderHistory() {
  const hist = getHistory();
  const el = document.getElementById('historyList');
  if (!hist.length) { el.innerHTML = '<div class="history-empty">尚無紀錄，計算後自動儲存</div>'; return; }
  el.innerHTML = '<div class="history-list">' +
    hist.map((h, idx) => {
      const safeUrl = h.url.replace(/'/g, '%27');
      return `<div class="history-item" onclick="restoreHistory('${safeUrl}')">
        <div class="hi-meta">
          <div class="hi-range">${h.rangeText}</div>
          <div class="hi-detail">倍率 ${h.mult}x · ${formatExp(h.totalNet)} EXP</div>
        </div>
        <div class="hi-time">
          <div class="hi-result">${h.minMult ? (formatDHM(h.minMult) || '—') : '—'}</div>
          <div class="hi-ts">${formatTS(h.ts)}</div>
        </div>
        <button class="hi-del" onclick="event.stopPropagation();deleteHistoryItem(${idx})" title="刪除">✕</button>
      </div>`;
    }).join('') + '</div>';
}

// === EVENTS ===
document.querySelectorAll('.mult-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentMult = parseFloat(btn.dataset.val);
    document.getElementById('customMult').value = currentMult;
    document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    calculate();
  });
});
document.getElementById('customMult').addEventListener('input', e => {
  currentMult = parseFloat(e.target.value) || 1;
  document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
  calculate();
});
['fromLevel','toLevel','expPerMin','expPer10Min','currentPct','currentExp','dailyHours'].forEach(id => {
  document.getElementById(id).addEventListener('input', calculate);
});

// === INIT ===
loadFromURL();
renderHistory();
calculate();
</script>
